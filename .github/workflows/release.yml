name: Release


on:

  push:

    tags:

      - "v*"



jobs:


 build-release:


  runs-on:
    ubuntu-latest


  steps:


  - name:
      Checkout

    uses:
      actions/checkout@v4



  - name:
      Package


    run:

      |

      tar czvf \
      SO101-OneClick-Installer-${{github.ref_name}}.tar.gz \
      .


  - name:
      Upload Release


    uses:
      softprops/action-gh-release@v2


    with:

      files:

        SO101-OneClick-Installer-${{github.ref_name}}.tar.gz
